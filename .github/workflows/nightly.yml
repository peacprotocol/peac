name: Nightly - Full Test Suite

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch: # Allow manual trigger
  push:
    tags:
      - 'v*' # Trigger on version tags

# Least-privilege: read-only by default. No job in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  full-test-suite:
    name: Complete Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable Corepack
        run: |
          corepack enable
          PM="$(node -p "require(require('path').join(process.env.GITHUB_WORKSPACE||process.cwd(),'package.json')).packageManager")"
          corepack prepare "$PM" --activate
          pnpm --version

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -w build

      - name: Run core test suite
        env:
          NODE_ENV: test
          PAYMENT_PROVIDER: mock
          PEAC_WEBHOOK_SECRET: test_secret
        run: |
          echo "Running core test suite..."
          pnpm run test:core

      - name: Core packages validation
        run: |
          echo "Core packages test completed"
          echo "v0.9.15 kernel-first architecture"

      - name: Performance validation
        run: |
          echo "Running performance validation..."
          echo "Performance SLO targets:"
          echo "  - Sign p95 <= 3ms"
          echo "  - Verify p95 <= 1ms"

  # Node-only runtime validation (Deno/Bun removed - not target runtimes for v0.9.x)
  node-runtime-validation:
    name: Node Runtime Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable Corepack
        run: |
          corepack enable
          PM="$(node -p "require(require('path').join(process.env.GITHUB_WORKSPACE||process.cwd(),'package.json')).packageManager")"
          corepack prepare "$PM" --activate
          pnpm --version

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -w build

      - name: Test @peac/crypto sign/verify runtime smoke
        run: |
          echo "Testing @peac/crypto sign/verify round-trip with Node.js..."

          node --input-type=module -e "
            const m = await import('./packages/crypto/dist/index.mjs');
            const { sign, verify, generateKeypair } = m;
            console.log('Testing with Node.js...');
            const { privateKey, publicKey } = await generateKeypair();
            console.log('[OK] Key generation works');

            const kid = 'nightly-test-key';
            const payload = { msg: 'test payload' };
            const jws = await sign(payload, privateKey, kid);
            if (typeof jws !== 'string' || jws.split('.').length !== 3) {
              throw new Error('sign() did not produce a compact JWS');
            }
            console.log('[OK] Signing works');

            const result = await verify(jws, publicKey);
            if (!result || !result.payload || result.payload.msg !== payload.msg) {
              throw new Error('Verification did not return the original payload');
            }
            console.log('[OK] Verification works');
            console.log('[OK] Node.js runtime validation complete');
          "

  shadow-lane:
    name: Shadow-mode test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable Corepack
        run: |
          corepack enable
          PM="$(node -p "require(require('path').join(process.env.GITHUB_WORKSPACE||process.cwd(),'package.json')).packageManager")"
          corepack prepare "$PM" --activate
          pnpm --version

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -w build

      - name: Run @peac/protocol test suite under shadow flag
        env:
          PEAC_INTERNAL_SHADOW_CORE: '1'
        run: pnpm --filter @peac/protocol test

      - name: Verify shadow-log redaction (any persisted artifacts)
        run: node scripts/verify-shadow-redaction.mjs

  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [full-test-suite, node-runtime-validation, shadow-lane]
    if: always()

    steps:
      - name: Results Summary
        run: |
          echo "Nightly test suite completed"
          echo ""
          if [ "${{ needs.full-test-suite.result }}" == "success" ] && [ "${{ needs.node-runtime-validation.result }}" == "success" ] && [ "${{ needs.shadow-lane.result }}" == "success" ]; then
            echo "[OK] All tests passed - system healthy"
          else
            echo "[WARN] Some tests failed - needs investigation"
            echo "Check logs above for details"
          fi
          echo ""
          echo "Node.js runtime validation completed"
          echo "Shadow-mode test suite completed"
          echo "Performance validation completed"
