name: Go SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/go/**'
      - 'specs/conformance/**'
      - '.github/workflows/go-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/go/**'
      - 'specs/conformance/**'
      - '.github/workflows/go-sdk.yml'

permissions:
  contents: read

concurrency:
  group: go-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format + Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: |
            sdks/go/go.sum
            sdks/go/middleware/chi/go.sum
            sdks/go/middleware/gin/go.sum

      - name: Format check (core)
        working-directory: sdks/go
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "FAIL: The following files are not formatted:"
            gofmt -l .
            exit 1
          fi
          echo "OK: All files are formatted"

      - name: Lint (core)
        working-directory: sdks/go
        env:
          GOWORK: 'off'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0
          golangci-lint run --timeout=5m ./. ./jws/... ./evidence/... ./conformance/... ./policy/... ./internal/...

  test:
    name: Build + Test + Race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/**/go.sum

      - name: Build (core)
        working-directory: sdks/go
        run: go build ./...

      - name: Test (core)
        working-directory: sdks/go
        run: go test ./... -count=1 -coverprofile=coverage.out

      - name: Test with race detector (core)
        working-directory: sdks/go
        run: go test -race ./... -count=1

      - name: Verify go.work lists every module
        working-directory: sdks/go
        run: |
          set -euo pipefail
          modules=$(find . -name go.mod | wc -l)
          listed=$(go list -m | wc -l)
          echo "go.mod files: ${modules}; go.work modules: ${listed}"
          test "${modules}" -eq "${listed}"

      # Each module is built, vetted and tested on its own (workspace mode off); modules are discovered.
      - name: Build + Vet + Test (every module)
        working-directory: sdks/go
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r mod; do
            echo "::group::${mod}"
            (cd "${mod}" && go build ./... && go vet ./... && go test ./... -count=1)
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find . -name go.mod -exec dirname {} \; | sort)
          echo "modules tested: ${count}"
          test "${count}" -eq "$(find . -name go.mod | wc -l)"

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: sdks/go/coverage.out
          retention-days: 7

  # The `test` job covers the module floor; this job covers the newest supported Go release line.
  test-newest-go:
    name: Build + Test (Go 1.27)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.27'
          cache-dependency-path: sdks/go/**/go.sum

      - name: Verify go.work lists every module
        working-directory: sdks/go
        run: |
          set -euo pipefail
          modules=$(find . -name go.mod | wc -l)
          listed=$(go list -m | wc -l)
          echo "go.mod files: ${modules}; go.work modules: ${listed}"
          test "${modules}" -eq "${listed}"

      - name: Build + Vet + Test (every module)
        working-directory: sdks/go
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r mod; do
            echo "::group::${mod}"
            (cd "${mod}" && go build ./... && go vet ./... && go test ./... -count=1)
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find . -name go.mod -exec dirname {} \; | sort)
          echo "modules tested: ${count}"
          test "${count}" -eq "$(find . -name go.mod | wc -l)"

  fuzz:
    name: Fuzz (bounded)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum

      - name: Fuzz evidence validator (30s)
        working-directory: sdks/go
        run: go test ./evidence -run=^$ -fuzz=^FuzzValidate$ -fuzztime=30s
