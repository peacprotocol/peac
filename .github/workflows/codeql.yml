name: 'CodeQL'

on:
  push:
    branches: ['main', 'release/*']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '37 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Bound the run explicitly. Without this the job inherits GitHub's 360-minute
    # ceiling, so a hung analysis would occupy a runner for six hours.
    timeout-minutes: 30
    permissions:
      # Least privilege: security-events:write is the minimum CodeQL needs to upload
      # SARIF (including on pull_request runs); contents and actions stay read-only.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: '/language:${{matrix.language}}'
