version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # ESM-only -- breaks dual CJS/ESM build
      - dependency-name: 'chalk'
        versions: ['>=5']
      # Track Node 22 types (engines floor)
      - dependency-name: '@types/node'
        versions: ['>=23']
      # Major API changes -- deferred
      - dependency-name: 'jose'
        versions: ['>=6']
      - dependency-name: 'commander'
        versions: ['>=12']
      - dependency-name: 'uuidv7'
        versions: ['>=1']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
  - package-ecosystem: 'gomod'
    directory: '/sdks/go'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
  - package-ecosystem: 'gomod'
    directory: '/sdks/go/bench'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
  - package-ecosystem: 'gomod'
    directory: '/sdks/go/middleware/chi'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
  - package-ecosystem: 'gomod'
    directory: '/sdks/go/middleware/echo'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
  - package-ecosystem: 'gomod'
    directory: '/sdks/go/middleware/gin'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
  - package-ecosystem: 'gomod'
    directory: '/sdks/go/middleware/nethttp'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
  - package-ecosystem: 'gomod'
    directory: '/sdks/go/middleware/paritytest'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
