<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      CSP delivered via meta. Every directive below is honoured in a meta element: default-src,
      script-src, style-src, img-src, font-src, connect-src, object-src, base-uri, form-action and
      worker-src. The build gates fail if any is missing.

      frame-ancestors is deliberately ABSENT. CSP Level 3 requires user agents to ignore it when it
      is delivered in a meta element, so declaring it here would assert a protection the document
      cannot provide. Framing protection is a response-header requirement on the serving origin and
      is recorded as such in the deployment gates.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Verify a PEAC record locally</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
